[project]
name = "trainer-backend"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.4",
    "dj-database-url>=2.2",
    "PyMySQL>=1.1",
    "python-dotenv>=1.0",
    "django-cors-headers>=4.4",
    "requests>=2.32",
]

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python manage.py migrate --noinput"
